<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Librería San Benito</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: medalla y título, grilla de santos en dos columnas, sección Capilla Santo Cristo en una columna; cada tarjeta abre un panel con foto, reseña corta y "Leer más" */
:root {
  --bg: #181213;
  --surface: #241b1d;
  --fg: #f1e9e6;
  --muted: #b4a5a7;
  --line: #3a2e31;
  --accent: #e08792;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  padding-block: 40px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.logo { width: 120px; height: 120px; max-width: 100%; display: block; }
h1 { font: 700 40px/1.02 var(--display); letter-spacing: 0.01em; margin: 0; text-align: center; text-wrap: balance; }
.rule { width: 48px; height: 2px; background: var(--accent); border-radius: 2px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
ul.obras { grid-template-columns: minmax(0, 1fr); }
button.card {
  display: flex; flex-direction: column; min-width: 0; width: 100%; height: 100%; padding: 0; margin: 0;
  background: var(--surface); color: var(--fg); font: inherit; text-align: inherit; cursor: pointer;
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  transition: border-color .12s ease, transform .12s ease;
}
button.card:hover { border-color: var(--accent); transform: translateY(-2px); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
button.card img { width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; object-position: 50% 3%; display: block; max-width: 100%; }
button.card.obra img { aspect-ratio: 2 / 1; object-position: 50% 50%; }
button.card.tri img { aspect-ratio: 10 / 9; object-position: 50% 50%; }
.name { padding: 12px 12px 14px; font: 700 18px/1.15 var(--display); text-align: center; text-wrap: balance; flex: 1; display: grid; place-items: center; gap: 4px; }
.name .sub { font: 500 12px/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.sec { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; margin-top: 12px; }
.sec h2 { font: 700 32px/1.05 var(--display); margin: 0; text-wrap: balance; }
.sec p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 38ch; }
.social { display: flex; justify-content: center; }
a.ig {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  color: var(--accent); border: 1px solid var(--line); background: var(--surface);
}
a.ig:hover { border-color: var(--accent); }
a.ig svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Panel */
dialog.saint {
  width: min(440px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; overflow: auto; overscroll-behavior: contain;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px;
}
dialog.saint::backdrop { background: rgba(8, 5, 6, 0.78); }
.sheet { display: flex; flex-direction: column; }
.sheet img { width: 100%; height: 300px; object-fit: cover; object-position: 50% 2%; display: block; max-width: 100%; }
.sheet img.wide { height: auto; aspect-ratio: 2 / 1; object-position: 50% 50%; }
.sheet img.tri { height: auto; aspect-ratio: 10 / 9; object-position: 50% 50%; cursor: zoom-in; }
.body { padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.body h2 { font: 700 30px/1.05 var(--display); margin: 0; text-wrap: balance; }
#saint-text { display: flex; flex-direction: column; gap: 12px; }
.body p { margin: 0; font-size: 16px; line-height: 1.65; color: var(--muted); max-width: 65ch; }
.parts { display: flex; flex-direction: column; gap: 24px; margin-top: 6px; }
.part { margin: 0; display: flex; flex-direction: column; gap: 10px; }
.part .zoom-btn { position: relative; display: block; width: 100%; padding: 0; margin: 0; border: 0; background: none; cursor: zoom-in; border-radius: 10px; }
.part .zoom-btn img { width: 100%; height: auto; aspect-ratio: auto; border-radius: 10px; border: 1px solid var(--line); display: block; }
.part .zoom-btn .lens {
  position: absolute; right: 10px; bottom: 10px; width: 36px; height: 36px; border-radius: 50%;
  background: rgba(24, 18, 19, 0.78); color: var(--fg); display: grid; place-items: center;
}
.part .zoom-btn .lens svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.tri-saint { padding-top: 22px; border-top: 1px solid var(--line); }
.tri-saint .zoom-btn img { aspect-ratio: 4 / 3; object-fit: cover; object-position: 50% 2%; }
.tri-saint .full { display: flex; flex-direction: column; gap: 12px; }
.tri-saint .full[hidden] { display: none; }
.tri-saint .s-more { align-self: flex-start; margin-top: 4px; padding: 9px 16px; font-size: 14px; }
.part figcaption { display: flex; flex-direction: column; gap: 6px; }
.part h3 { font: 700 23px/1.1 var(--display); margin: 0; text-wrap: balance; }
.body .part p { font-size: 15.5px; line-height: 1.6; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.more {
  font: 600 15px/1 var(--body); color: var(--accent); background: transparent; cursor: pointer;
  border: 1px solid var(--accent); border-radius: 999px; padding: 11px 20px;
}
.more:hover { background: var(--accent); color: var(--surface); }
.close {
  font: 600 15px/1 var(--body); color: var(--fg); background: transparent; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 11px 20px;
}
.close:hover { border-color: var(--accent); }
.pin {
  position: absolute; width: 28px; height: 28px; border-radius: 50%; transform: translate(-50%, -50%);
  background: var(--accent); color: #181213; border: 2px solid #181213;
  font: 700 14px/1 var(--body); display: grid; place-items: center; pointer-events: none;
}
ol.legend { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
ol.legend li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; }
ol.legend .n {
  width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #181213;
  font: 700 14px/1 var(--body); display: grid; place-items: center;
}
ol.legend b { display: block; font: 700 18px/1.15 var(--display); color: var(--fg); }
ol.legend span.t { display: block; margin-top: 2px; font-size: 15px; line-height: 1.5; color: var(--muted); }
/* Ampliar imagen */
dialog.zoom {
  width: 100%; height: 100%; max-width: 100%; max-height: 100%; margin: 0; padding: 0; border: 0;
  background: #080506; color: var(--fg);
}
dialog.zoom[open] { display: flex; flex-direction: column; }
.zoom-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
}
.zoom-cap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.zoom-cap b { font: 700 20px/1.1 var(--display); }
.zoom-cap span { font-size: 13px; color: var(--muted); }
.zoom-stage { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 0 8px 16px; }
.zoom-stage img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; cursor: zoom-in; border-radius: 6px; }
.zoom-stage.big { display: block; }
.zoom-stage.big img { max-width: none; max-height: none; cursor: zoom-out; }
@media (prefers-reduced-motion: reduce) { button.card { transition: none; } }

.menu { display: flex; flex-direction: column; gap: 14px; }
a.mi {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px;
  transition: border-color .12s ease, transform .12s ease;
}
a.mi:hover { border-color: var(--accent); transform: translateY(-2px); }
a.mi b { font: 700 26px/1.1 var(--display); display: block; }
a.mi span.d { display: block; margin-top: 4px; font-size: 14px; line-height: 1.4; color: var(--muted); }
a.mi svg { flex: none; width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
a.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 15px; padding: 6px 0; }
a.back:hover { color: var(--accent); }
a.back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.soon { text-align: center; color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0; }
.hours { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.hours h2 { font: 700 28px/1.05 var(--display); margin: 0; }
.hours h3 { font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.hours dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; font-size: 15px; line-height: 1.45; }
.hours dt { color: var(--muted); }
.hours dd { margin: 0; text-align: right; font-weight: 500; }
.hours .note { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5; }
a.mail { align-self: flex-start; display: inline-block; text-decoration: none; color: var(--fg); border: 1px solid var(--accent); border-radius: 999px; padding: 11px 18px; font: 600 15px/1 var(--body); max-width: 100%; overflow-wrap: anywhere; }
a.mail:hover { background: var(--accent); color: #181213; }
</style>
