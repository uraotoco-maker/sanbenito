<title>Librería San Benito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: título y medalla centrados, grilla de dos columnas; al tocar un santo se abre un panel con su foto y una reseña corta */
:root {
  --bg: #181213;
  --surface: #241b1d;
  --fg: #f1e9e6;
  --muted: #b4a5a7;
  --line: #3a2e31;
  --accent: #e08792;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  padding-block: 40px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.logo { width: 120px; height: 120px; max-width: 100%; display: block; }
h1 { font: 700 40px/1.02 var(--display); letter-spacing: 0.01em; margin: 0; text-align: center; text-wrap: balance; }
.rule { width: 48px; height: 2px; background: var(--accent); border-radius: 2px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
button.card {
  display: flex; flex-direction: column; min-width: 0; width: 100%; height: 100%; padding: 0; margin: 0;
  background: var(--surface); color: var(--fg); font: inherit; text-align: inherit; cursor: pointer;
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  transition: border-color .12s ease, transform .12s ease;
}
button.card:hover { border-color: var(--accent); transform: translateY(-2px); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
button.card img { width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover; object-position: 50% 25%; display: block; max-width: 100%; }
.name { padding: 12px 12px 14px; font: 700 18px/1.15 var(--display); text-align: center; text-wrap: balance; flex: 1; display: grid; place-items: center; }
.social { display: flex; justify-content: center; }
a.ig {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  color: var(--accent); border: 1px solid var(--line); background: var(--surface);
}
a.ig:hover { border-color: var(--accent); }
a.ig svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Panel del santo */
dialog.saint {
  width: min(440px, calc(100% - 32px)); max-height: calc(100% - 32px); padding: 0; overflow: auto; overscroll-behavior: contain;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px;
}
dialog.saint::backdrop { background: rgba(8, 5, 6, 0.78); }
.sheet { display: flex; flex-direction: column; }
.sheet img { width: 100%; height: 260px; object-fit: cover; object-position: 50% 20%; display: block; max-width: 100%; }
.body { padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.body h2 { font: 700 30px/1.05 var(--display); margin: 0; text-wrap: balance; }
#saint-text { display: flex; flex-direction: column; gap: 12px; }
.body p { margin: 0; font-size: 16px; line-height: 1.65; color: var(--muted); max-width: 65ch; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.more {
  font: 600 15px/1 var(--body); color: var(--accent); background: transparent; cursor: pointer;
  border: 1px solid var(--accent); border-radius: 999px; padding: 11px 20px;
}
.more:hover { background: var(--accent); color: var(--surface); }
.close {
  font: 600 15px/1 var(--body); color: var(--fg); background: transparent; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 11px 20px;
}
.close:hover { border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { button.card { transition: none; } }
</style>

      <button class="card" type="button" data-name="San Plácido" data-short="Discípulo de San Benito. Según la tradición, su padre lo confió siendo niño al santo en Subiaco, y San Benito lo salvó de morir ahogado en un lago gracias a la obediencia de San Mauro. Fue enviado a Sicilia, donde murió mártir junto a sus compañeros. Su fiesta es el 5 de octubre." data-full="Plácido fue uno de los primeros discípulos de San Benito. Según la tradición, nació en Roma en una familia noble y, siendo todavía un niño, su padre lo confió a Benito para que lo educara en Subiaco, donde el santo vivía con sus monjes.

Su nombre aparece en un episodio muy conocido de la vida de San Benito. Un día, el pequeño Plácido fue a buscar agua a un lago, cayó y la corriente empezó a arrastrarlo. Benito, que estaba en su celda, advirtió lo que pasaba y mandó a Mauro a rescatarlo. Mauro corrió sobre el agua, sacó al niño y recién después notó lo que había hecho. Cuando se lo contaron a Benito, el santo lo atribuyó a la obediencia de Mauro.

Una tradición posterior cuenta que Plácido fue enviado a Sicilia para fundar un monasterio y que allí murió mártir, junto con sus compañeros, a manos de piratas. Los historiadores discuten cuánto hay de cierto en este final, pero la Iglesia lo venera como mártir. En la imagen se lo ve con una palma, que es el signo de los mártires.

Su fiesta se celebra el 5 de octubre.">

      <button class="card" type="button" data-name="Santo Domingo de Silos" data-short="Monje benedictino español del siglo XI, nacido en La Rioja. Fue abad del monasterio de San Sebastián de Silos, en Burgos, que renovó y que hoy lleva su nombre. Es recordado por rescatar cautivos y su fiesta es el 20 de diciembre." data-full="Domingo nació hacia el año 1000 en Cañas, en La Rioja, en el seno de una familia de campesinos. De joven fue pastor y se retiró a vivir en soledad y oración, hasta que ingresó como monje benedictino en el monasterio de San Millán de la Cogolla. Allí fue elegido prior y se destacó por su vida de oración y su obediencia a la Regla de San Benito.

Tuvo un enfrentamiento con el rey García de Navarra, que quería quedarse con bienes del monasterio. Domingo se negó a entregarlos y fue desterrado. Más tarde el rey Fernando I de Castilla lo recibió y le confió la abadía de San Sebastián de Silos, en Burgos, que estaba casi en ruinas.

Como abad la restauró, reunió una comunidad numerosa y levantó las bases del monasterio que hoy lleva su nombre y que es famoso por su claustro románico. Se lo recuerda también por su caridad con los pobres y por rescatar a cristianos que habían sido tomados cautivos, por lo que es patrono de los prisioneros. Murió el 20 de diciembre de 1073.

Su fiesta se celebra el 20 de diciembre.">

      <button class="card" type="button" data-name="San Francisco de Asís" data-short="Nació en Asís, Italia, hacia 1182. Dejó la riqueza de su familia para vivir en pobreza y fundó la Orden de los Frailes Menores, los franciscanos. Es conocido por su amor a toda la creación y por el Cántico de las criaturas. Su fiesta es el 4 de octubre." data-full="Francisco nació en Asís, Italia, hacia 1182, hijo de un rico comerciante de telas. De joven soñaba con la fama de caballero y participó en una guerra en la que fue tomado prisionero. Tras una enfermedad empezó a cambiar de vida. Según cuenta la tradición, ante el crucifijo de la iglesia de San Damián oyó que Cristo le pedía reparar su casa, y entendió que debía vivir el Evangelio al pie de la letra.

Renunció a la herencia de su padre ante el obispo de Asís y eligió vivir en pobreza, atendiendo a los leprosos y predicando. Pronto se le unieron otros hermanos y así nació la Orden de los Frailes Menores, los franciscanos. Junto con Santa Clara fundó también la rama de las Hermanas Pobres. En 1223 preparó en Greccio una representación del nacimiento de Jesús, origen del pesebre navideño.

Es muy conocido por su amor a toda la creación, que quedó plasmado en el Cántico de las criaturas, donde alaba a Dios por el sol, la luna, el agua y el fuego. Dos años antes de morir, en el monte Alvernia, recibió las llagas de Cristo, los estigmas. Murió en 1226 y fue canonizado dos años después. Es patrono de Italia y de quienes cuidan el medio ambiente.

Su fiesta se celebra el 4 de octubre.">

      <button class="card" type="button" data-name="Santa Gertrudis" data-short="Santa Gertrudis la Grande fue una monja y mística alemana del siglo XIII, del monasterio de Helfta. Sus escritos, llenos de oración y confianza en Dios, hicieron de ella una de las grandes voces de la espiritualidad benedictina y cisterciense. Su fiesta es el 16 de noviembre." data-full="Gertrudis la Grande nació en 1256 en Turingia, Alemania. A los cinco años fue confiada al monasterio de Helfta, que vivía según la Regla de San Benito y era un centro de oración y de estudio. Allí la educó la abadesa Gertrudis de Hackeborn, y recibió una formación muy sólida en latín, en la Biblia y en los Padres de la Iglesia.

A los 25 años tuvo una experiencia espiritual que cambió su vida: sintió la presencia de Cristo y desde entonces se entregó por completo a la oración. Gertrudis escribió con sencillez y profundidad sobre lo que vivía. Entre sus obras se destacan El heraldo del amor divino y los Ejercicios, textos muy leídos desde entonces. En ellos aparece con fuerza la devoción al Corazón de Jesús, de la cual es una de las grandes precursoras.

Sus escritos se apoyan en la liturgia y en la Sagrada Escritura, y por eso son una enseñanza para quien quiere rezar con la Iglesia. Es una de las pocas mujeres a quienes se llama &quot;la Grande&quot;. Murió hacia 1302 en Helfta.

Su fiesta se celebra el 16 de noviembre.">

      <button class="card" type="button" data-name="San Juan Bautista" data-short="Precursor de Jesús. Predicó la conversión a orillas del río Jordán y bautizó a Jesús. Murió decapitado por orden del rey Herodes. La Iglesia celebra su nacimiento el 24 de junio y su martirio el 29 de agosto." data-full="Juan fue el hijo de Zacarías e Isabel, pariente de la Virgen María, y nació unos seis meses antes que Jesús. El Evangelio de San Lucas cuenta que su nacimiento fue anunciado por un ángel cuando sus padres ya eran ancianos.

Vivió en el desierto de Judea, vestido con piel de camello y alimentándose de langostas y miel silvestre. Desde allí predicaba a orillas del río Jordán un bautismo de conversión y pedía a la gente que cambiara de vida. Muchos acudían a escucharlo. Un día llegó Jesús para ser bautizado, y Juan lo señaló con las palabras &quot;Este es el Cordero de Dios que quita el pecado del mundo&quot;. Por eso, en las imágenes aparece a menudo con un cordero a sus pies, como en esta.

Juan reprendió públicamente al rey Herodes Antipas por su matrimonio con Herodías, y por eso fue encarcelado. Según el Evangelio, terminó decapitado por orden de Herodes. Jesús dijo de él que no había nacido nadie mayor entre los hombres. Fue el precursor que preparó el camino al Señor.

La Iglesia celebra su nacimiento el 24 de junio y su martirio el 29 de agosto.">

      <button class="card" type="button" data-name="San Mauro" data-short="Discípulo de San Benito desde niño. Según la tradición, caminó sobre el agua por obediencia para salvar a San Plácido de ahogarse. Llevó la regla benedictina a Francia, donde fundó el monasterio de Glanfeuil. Su fiesta es el 15 de enero." data-full="Mauro nació en Roma hacia el año 512, hijo de un noble llamado Equicio. Con unos doce años fue confiado a San Benito en Subiaco y se convirtió en uno de sus discípulos más cercanos y en su ayudante de confianza. Con el tiempo, Benito le encargó tareas de responsabilidad dentro de la comunidad.

Es el protagonista de un episodio famoso: cuando el pequeño Plácido cayó a un lago, Benito mandó a Mauro a salvarlo, y este caminó sobre el agua hasta sacarlo, sin darse cuenta de lo que hacía. Benito lo atribuyó a la obediencia de su discípulo; Mauro, en cambio, decía que había sido por la orden de su maestro. La escena muestra el valor que la tradición benedictina da a la obediencia.

Una tradición del siglo IX, que los historiadores consideran poco segura, cuenta que Benito lo envió a Francia, donde habría fundado el monasterio de Glanfeuil, a orillas del Loira, y que murió allí hacia 584. Siglos después, los benedictinos de la Congregación de San Mauro, famosa por sus estudios y ediciones de textos antiguos, tomaron su nombre. En la imagen aparece como abad, con el báculo.

Su fiesta se celebra el 15 de enero.">

<dialog class="saint" id="saint" aria-labelledby="saint-name">
  <div class="sheet">
    <img id="saint-img" src="" alt="">
    <div class="body">
      <h2 id="saint-name"></h2>
      <p id="saint-text"></p>
      <div class="actions">
        <button class="more" id="saint-more" type="button" aria-expanded="false">Leer más</button>
        <button class="close" id="saint-close" type="button">Cerrar</button>
      </div>
    </div>
  </div>
</dialog>

<script>
(function () {
  var dlg = document.getElementById("saint");
  var img = document.getElementById("saint-img");
  var nameEl = document.getElementById("saint-name");
  var textEl = document.getElementById("saint-text");
  var moreBtn = document.getElementById("saint-more");
  var current = null;
  var expanded = false;
  function render() {
    var parts = current.getAttribute(expanded ? "data-full" : "data-short").split("\n\n");
    textEl.textContent = "";
    for (var j = 0; j < parts.length; j++) {
      var p = document.createElement("p");
      p.textContent = parts[j];
      textEl.appendChild(p);
    }
    moreBtn.textContent = expanded ? "Leer menos" : "Leer más";
    moreBtn.setAttribute("aria-expanded", expanded ? "true" : "false");
  }
  function open(card) {
    current = card;
    expanded = false;
    var pic = card.querySelector("img");
    img.src = pic.src;
    img.alt = pic.alt;
    nameEl.textContent = card.getAttribute("data-name");
    render();
    if (dlg.showModal) { dlg.showModal(); } else { dlg.setAttribute("open", ""); }
    dlg.scrollTop = 0;
  }
  function close() { if (dlg.close) { dlg.close(); } else { dlg.removeAttribute("open"); } }
  var cards = document.querySelectorAll("button.card");
  for (var i = 0; i < cards.length; i++) {
    cards[i].addEventListener("click", function (e) { open(e.currentTarget); });
  }
  moreBtn.addEventListener("click", function () {
    expanded = !expanded;
    render();
    if (expanded) { nameEl.scrollIntoView({ block: "start" }); } else { dlg.scrollTop = 0; }
  });
  document.getElementById("saint-close").addEventListener("click", close);
  dlg.addEventListener("click", function (e) { if (e.target === dlg) { close(); } });
})();
</script>

</body></html>
